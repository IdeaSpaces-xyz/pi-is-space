name: SLC Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  slc-review:
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      !contains(github.event.pull_request.labels.*.name, 'tiny')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run SLC Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request using our SLC (Simple, Lovable, Complete) principles for the IdeaSpaces Pi extension.

            ## Context
            - This repo: `@ideaspaces/pi-is-space`, a Pi extension giving IdeaSpaces tools local-first parity with the Claude Code plugin. Entry point `src/index.ts`; skills shipped under `skills/`.
            - **Thin wrapper, split at the approved boundary.** Portable read-only local shape comes from exact-pinned `@ideaspaces/protocol`; platform interactions (auth, sync, publish) and transitional local writes remain in the IdeaSpaces CLI; Pi owns harness placement, UI, session/Change state, mounts, and lifecycle writes. Data flow: `Agent (Pi) → pi-is-space → protocol (local reads) | CLI (platform + transitional writes)`.
            - Tool surface: `is_navigate`, `is_mount`/`is_unmount`, `is_write`, `is_status`, `is_commit`, `is_change_open`/`is_change_close`, `is_pull`, `is_push`, `is_auth`. Pi's native `read`/`edit`/`write`/`bash` cover file inspection, search, code/config edits, raw git, moves, and deletes — pi-is-space must not duplicate them.
            - No `sw_*` tools (that's the legacy `pi-sw-space`, remote-first surface). New work lives here.
            - Dependencies: `@ideaspaces/protocol`, `@ideaspaces/cli`, and `@ideaspaces/sdk` are exact git pins; peer deps include `@earendil-works/pi-coding-agent`, `@earendil-works/pi-ai`, and `typebox`.
            - Session awareness: assemble protocol-owned Content/git/path/workspace facts in-process, render shared sections canonically, add Pi-owned working-set/catalog/Change layers, and place them through Pi's harness. Missing `_agent/purpose.md` / `_agent/now.md` are drift signals, not gaps to silently fill. Seen-ref updates remain surface-owned writes.
            - Reference: this repo's CLAUDE.md and the monorepo root CLAUDE.md (root principles).

            ## SLC label context
            - `slc:simple` / `slc:lovable` / `slc:complete`: quick validation for labeled dimensions, deeper review for unlabeled.
            - `needs:slc-review`: do deeper analysis.
            - No SLC labels: standard full review.

            ## SLC Framework Review

            ### Simple 🎯
            - Is this the simplest adapter that bridges Pi to the protocol and CLI at their approved boundaries?
            - Shared portable shape logic belongs in `@ideaspaces/protocol`; platform/auth/sync/write behavior belongs in the CLI; harness placement, UI, and session roles belong here. Push logic to the correct owner, not reflexively to one executable.
            - Does it reuse Pi's native `read`/`edit`/`write`/`bash` instead of reimplementing navigation, search, git, or file ops?
            - Any unnecessary new abstractions or tool surface?

            ### Lovable ❤️
            - Tool ergonomics: clear schemas, predictable defaults, errors from protocol reads or CLI operations surfaced legibly rather than swallowed.
            - Capture flow stays coherent: `is_write` → refine with returned `sha` or `is_status({ path })` → user confirms → `is_commit` → optional `is_sync`.
            - Graceful degradation: absent `_agent/`, missing space root, CLI/sync/auth failures handled without crashing the session.
            - Awareness injection is a signal, not noise — drift surfaces honestly.

            ### Complete 🏁
            - Does the change keep tool registration, schemas, and skills consistent with each other?
            - No leftover `sw_*` / remote-first dead code, stale skill references, or unused imports.
            - Skills under `skills/` match the actual tool surface and capture flow.
            - Dependency pins (protocol/CLI/SDK git SHAs) updated deliberately when behavior depends on them — not left stale, not bumped blindly.

            ## pi-is-space-specific checks
            - **Thin wrapper preservation.** Reject portable shape logic that should live in the protocol, platform/write logic that should live in the CLI, or generic tools Pi already supplies. Keep Pi-specific placement, roles, UI, and session behavior here.
            - **No tool duplication.** Don't add tools that re-do Pi natives (`read`/`edit`/`write`/`bash`).
            - **No `sw_*` revival.** The remote-first surface belongs to legacy `pi-sw-space`.
            - **Read-only awareness assembly.** Session-start awareness walks the tree and reads; it must not write or mutate `_agent/`.
            - **Cross-platform paths** via `node:path` (no `/` string concatenation).
            - **Async by default** for any I/O or CLI invocation.

            ## Anti-pattern detection 🚨
            - Reimplementing protocol shape or CLI platform/write behavior inside the wrapper.
            - Adding speculative tools or schema surface no agent flow needs yet.
            - Swallowing CLI/SDK errors so failures look like successes.
            - Auto-filling missing `_agent/` files instead of surfacing drift.
            - Bumping dependency SHAs without a stated reason tied to the change.

            ## Output format

            **SLC Assessment:**
            - ✅/⚠️/❌ Simple: [brief assessment]
            - ✅/⚠️/❌ Lovable: [brief assessment]
            - ✅/⚠️/❌ Complete: [brief assessment]

            **Anti-Patterns Found:** [list or "None detected"]

            **pi-is-space-Specific Issues:** [list or "None detected"]

            **Detailed Feedback:** [specific issues and suggestions]

            **Recommendation:** Approve / Request Changes / Comment

            Use `gh pr comment` to post your review.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
